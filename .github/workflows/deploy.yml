# Deploys the site to the VPS on every push to main (or by hand: Actions → Deploy to VPS → Run workflow).
# Uses the same server script as ops/deploy/deploy.bat: the live site keeps running on the old build
# until the new one is built and answers, and rolls back by itself if anything fails.
name: Deploy to VPS

on:
  push:
    branches: [main]
    # Helper scripts for the PC and docs don't change the site: no deploy for them.
    paths-ignore:
      - "ops/local/**"
      - "ops/github/**"
      - "ops/staging/**"
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: root@62.171.174.17
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "Secrets VPS_SSH_KEY / VPS_KNOWN_HOSTS are not set yet - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Package the code
        if: steps.secrets.outputs.ready == 'true'
        run: |
          tar -czf /tmp/momenti-src.tar.gz --exclude='*.log' --exclude=__pycache__ --exclude='*.pyc' \
            --exclude='.kfl-*' --exclude=weights --exclude='globals.css.before-*' \
            app components lib public scripts ops proxy.ts next.config.ts package.json postcss.config.mjs eslint.config.mjs

      - name: Prepare SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload and deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          SSHOPT="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 -o StrictHostKeyChecking=yes"
          scp $SSHOPT /tmp/momenti-src.tar.gz "$HOST:/tmp/momenti-src.tar.gz"
          scp $SSHOPT ops/deploy/deploy-remote.sh "$HOST:/tmp/momenti-deploy.sh"
          ssh $SSHOPT "$HOST" "bash /tmp/momenti-deploy.sh"

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
