# One-time setup of test.momenti.info (re-run it to refresh nginx/HTTPS/password). Actions → "Test site: setup" → Run workflow.
name: "Test site: setup"

on:
  workflow_dispatch:

concurrency:
  group: test-site
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: root@62.171.174.17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Upload code and set up test.momenti.info
        env:
          TEST_SITE_PASSWORD: ${{ secrets.TEST_SITE_PASSWORD }}
        run: |
          git archive --format=tar.gz -o /tmp/momenti-test-src.tar.gz HEAD
          SSHOPT="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 -o StrictHostKeyChecking=yes"
          scp $SSHOPT /tmp/momenti-test-src.tar.gz "$HOST:/tmp/momenti-test-src.tar.gz"
          scp $SSHOPT ops/staging/setup-test-remote.sh "$HOST:/tmp/momenti-test-setup.sh"
          # The password goes over stdin, never on a command line.
          printf '%s\n' "$TEST_SITE_PASSWORD" | ssh $SSHOPT "$HOST" "bash /tmp/momenti-test-setup.sh"
      # Short summary (key NAMES only, never values) posted as an issue, readable from anywhere.
      - name: Report setup summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SSHOPT="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes"
          scp $SSHOPT "$HOST:/tmp/momenti-test-setup.log" /tmp/setup.log || echo "(log-u nuk u mor)" > /tmp/setup.log
          { echo "Test site setup (${{ job.status }}) per ${GITHUB_SHA::7}"; echo; echo '```'; grep -E "^==|celesat|DNS|HTTPS|certbot|GATI|DESHTOI|test /kycu|nginx" /tmp/setup.log | sed -E 's/=[^ ]{6,}/=***/g' | tail -n 60; echo '```'; } > /tmp/report.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Test site setup: ${{ job.status }}" --body-file /tmp/report.md || true

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
