# Upgrades Next.js (security fixes) and commits package.json + lockfile to the test branch.
name: "Deps: upgrade Next.js"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "versioni i Next.js"
        required: true
        default: "16.4.3"
permissions:
  contents: write
  issues: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          npm install --save-exact --ignore-scripts --no-audit --no-fund next@"$V"
          npm install --save-exact --save-dev --ignore-scripts --no-audit --no-fund eslint-config-next@"$V"
          npm audit --omit=dev > /tmp/audit.txt 2>&1 || true
          npx --yes tsc --noEmit -p . > /tmp/tsc.txt 2>&1 && echo "tsc OK" >> /tmp/tsc.txt || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Security: upgrade Next.js to $V (fixes critical RCE advisories GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr)" && git push origin HEAD:test
          { echo "Next.js -> $V"; echo '```'; tail -n 12 /tmp/audit.txt; echo; tail -n 15 /tmp/tsc.txt; echo '```'; } > /tmp/r.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Upgrade Next.js $V" --body-file /tmp/r.md
